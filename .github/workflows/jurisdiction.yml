name: Jurisdiction package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: bun run --cwd packages/jurisdiction build
      - run: bun test packages/jurisdiction
      - run: cargo test --locked --manifest-path packages/jurisdiction/Cargo.toml
      - run: cargo clippy --locked --manifest-path packages/jurisdiction/Cargo.toml --all-targets -- -D warnings
      - run: bun run lint
