name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Verify release tag
        run: >-
          node -e "const { version } = require('./package.json'); if (process.env.RELEASE_TAG !== 'v' + version) { console.error('Release tag must be v' + version); process.exit(1); }"
      - name: Select npm dist-tag
        id: npm_tag
        run: >-
          node -e "const { version } = require('./package.json'); require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + (version.includes('-') ? 'next' : 'latest') + '\n');"
      - run: npm publish --tag "${{ steps.npm_tag.outputs.tag }}"
