[package]
name = "ekubo-jurisdiction"
version = "0.1.0"
edition = "2024"
description = "Stateless EIP-712 jurisdiction attestation verification for native and WebAssembly consumers"
license = "MIT"
repository = "https://github.com/EkuboProtocol/typescript-sdk"
include = ["rust/**", "fixtures/**", "protocol.json", "Cargo.toml", "README.md", "LICENSE"]

[lib]
path = "rust/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
alloy-primitives = { version = "=1.5.7", default-features = false, features = ["k256", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"

[lints.clippy]
cognitive_complexity = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
